<svg width="350" height="110" viewBox="0 0 350 110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .adaptive-text { mix-blend-mode: difference; }
  </style>

  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C" />
      <stop offset="100%" style="stop-color:#EA580C" />
    </linearGradient>

    <clipPath id="iconClip">
      <rect x="0" y="10" width="90" height="90" rx="22"/>
    </clipPath>
  </defs>

  <rect x="0" y="10" width="90" height="90" rx="22" fill="url(#brandGradient)"/>
  <g clip-path="url(#iconClip)">
    <line x1="3" y1="55" x2="17" y2="55" stroke="rgba(255,255,255,0.6)" stroke-width="2.2" stroke-linecap="round"/>
    <polyline
      points="17,55 20,51 23,59 27,55 31,22 37,88 42,55 45,47 48,63 51,51 54,59 57,55 61,57 64,55"
      fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="64" y1="55" x2="87" y2="55" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="106" y="69" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" letter-spacing="-0.5" transform="translate(0, -5)">
    <tspan fill="white" class="adaptive-text" font-weight="400">type</tspan><tspan fill="#EA580C" dx="3.5" letter-spacing="0.5" font-weight="600">quake</tspan>
  </text>

  <text x="107" y="93" transform="translate(0, 6)" font-family="monospace" font-size="12" font-weight="400" letter-spacing="1" fill="#6B7280">
    TYPE IMPACT ANALYSIS
  </text>
</svg>


